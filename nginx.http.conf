# nginx.http.conf — Producción SIN dominio ni TLS: solo HTTP por la IP de la VM (modo temporal).
# Se usa cuando el .env del servidor NO define DOMAIN (el workflow de despliegue lo detecta). Para HTTPS con dominio
# se usa nginx.prod.conf (sin cambios). Aviso: sin TLS las contraseñas y los tokens viajan en claro; usar solo con
# datos de prueba y llaves de Wompi de SANDBOX hasta tener dominio y certificado.

# Límite de intentos en /api/auth/* (fuerza bruta): 10 por minuto por IP, con ráfaga de 10
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_status 429;

server_tokens off;

# DNS interno de Docker: con variables en proxy_pass nginx resuelve "backend" y "frontend" en cada petición (cada 10 s),
# así arranca aunque el backend aún no exista y sigue funcionando si un contenedor se recrea y cambia de IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    # Cabeceras de seguridad (sin HSTS: no hay HTTPS)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Tamaño máximo de upload (fotos de productos)
    client_max_body_size 10M;

    # Inicio de sesión y registro: con límite de intentos
    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        set $mano_backend backend:8080;
        proxy_pass http://$mano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API → backend
    location /api/ {
        set $mano_backend backend:8080;
        proxy_pass http://$mano_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend → Next.js
    location / {
        set $mano_frontend frontend:3000;
        proxy_pass http://$mano_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
