name: Deploy Mano App

# Despliegue MANUAL a la VM de Azure (Actions → Deploy Mano App → Run workflow).
# NO se dispara con `push`: así un merge a main nunca despliega solo (decisión de la migración, F0.3).
# Despliega el commit EXACTO desde el que se lanza el workflow (imágenes etiquetadas con su SHA), hace respaldo de la
# base de datos antes, verifica que el backend quede sano y, si no, vuelve a la versión anterior.
#
# Antes de la primera vez (una sola vez, ver docs/DEPLOY.md):
#   · Secrets:   GHCR_TOKEN (PAT con read:packages) · AZURE_SSH_KEY (llave privada)  — o AZURE_VM_PASSWORD si aún usas contraseña
#   · Variables: AZURE_VM_HOST · AZURE_VM_USER · (opcional) APP_URL = https://tu-dominio  → chequeo externo al terminar
#   · Opcional:  secret AZURE_VM_FINGERPRINT (huella SHA256 del host SSH) para no confiar a ciegas en el servidor
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe DEPLOY para confirmar el despliegue a la VM de Azure'
        required: true
        default: ''

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mano-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mano-frontend

jobs:
  # ── 0. Confirmación escrita (evita despliegues por un clic accidental) ───────
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar confirmación
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "::error::Para desplegar escribe exactamente DEPLOY en el campo 'confirm'."
          exit 1

  # ── 1. Verificar que compila y pasa las pruebas ──────────────────────────────
  test:
    needs: confirm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Backend (vet + build + test)
        working-directory: backend
        run: |
          go vet ./...
          go build ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Web (tsc)
        working-directory: web
        run: npm ci && npx tsc --noEmit --incremental false

      - name: Imágenes del diseñador intactas
        run: bash scripts/verify-design-assets.sh

  # ── 2. Build y push de imágenes a GHCR (tag = SHA del commit) ────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build y push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build y push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy a la VM de Azure ───────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # permite exigir aprobación manual en Settings → Environments

    steps:
      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_SHA: ${{ github.sha }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST || vars.AZURE_VM_HOST }}
        with:
          host: ${{ secrets.AZURE_VM_HOST || vars.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER || vars.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          # SOLO como secret. NO usar vars.*: las variables no se ocultan en los logs y los logs de este repo son públicos.
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          fingerprint: ${{ secrets.AZURE_VM_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_SHA,VM_HOST
          script: |
            # El script se guarda en un archivo y se ejecuta con la entrada cerrada (< /dev/null). Con "bash -s <<EOF",
            # un comando que lea stdin (docker compose exec) se come el resto del script y el paso termina "bien" sin terminar.
            SCRIPT_FILE=$(mktemp /tmp/mano-deploy.XXXXXX)
            cat > "$SCRIPT_FILE" <<'REMOTE'
            set -euo pipefail
            cd /opt/mano-app
            COMPOSE="docker compose -f docker-compose.prod.yml"

            envget() { grep -E "^$1=" .env | head -1 | cut -d= -f2- | tr -d '\r'; }

            echo "▶ 1/6 Comprobando el .env del servidor"
            [ -f .env ] || { echo "❌ Falta /opt/mano-app/.env (ver docs/DEPLOY.md)"; exit 1; }
            for v in GITHUB_OWNER POSTGRES_USER POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET; do
              grep -qE "^${v}=.+" .env || { echo "❌ Falta ${v} en .env"; exit 1; }
            done
            JWT_LEN=$(grep -E '^JWT_SECRET=' .env | cut -d= -f2- | tr -d '\r' | wc -c)
            [ "$JWT_LEN" -ge 33 ] || { echo "❌ JWT_SECRET debe tener al menos 32 caracteres"; exit 1; }
            if [ -z "$(envget DOMAIN)" ]; then
              # Sin dominio: modo temporal solo HTTP por la IP (nginx.http.conf). Con DOMAIN se usa HTTPS (nginx.prod.conf).
              echo "ℹ️  Sin DOMAIN en .env: modo HTTP por IP (sin TLS). Usa solo datos de prueba y llaves de Wompi de sandbox."
              [ -n "${VM_HOST:-}" ] || { echo "❌ Falta AZURE_VM_HOST para armar APP_BASE_URL"; exit 1; }
              export NGINX_CONF=nginx.http.conf
              export APP_BASE_URL="http://${VM_HOST}"
              echo "   APP_BASE_URL=${APP_BASE_URL}"
            else
              echo "ℹ️  DOMAIN=$(envget DOMAIN): modo HTTPS con dominio."
              grep -qE "^APP_BASE_URL=.+" .env || { echo "❌ Falta APP_BASE_URL en .env"; exit 1; }
            fi

            echo "▶ 2/6 Código exacto del commit ${DEPLOY_SHA}"
            git fetch --prune origin
            git checkout --force "${DEPLOY_SHA}"

            echo "▶ 3/6 Respaldo de la base de datos"
            PGUSER_ENV=$(envget POSTGRES_USER); PGDB_ENV=$(envget POSTGRES_DB); PGDB_ENV=${PGDB_ENV:-mano}
            # azureuser no puede escribir en /opt: los respaldos van a su carpeta personal
            BACKUP_DIR="${HOME}/mano-backups"
            mkdir -p "${BACKUP_DIR}"
            if $COMPOSE ps --status running --services 2>/dev/null | grep -qx postgres; then
              $COMPOSE exec -T postgres pg_dump -U "${PGUSER_ENV}" "${PGDB_ENV}" | gzip > "${BACKUP_DIR}/mano-$(date +%Y%m%d-%H%M%S)-${DEPLOY_SHA:0:7}.sql.gz"
              ls -1t "${BACKUP_DIR}"/*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
              echo "   respaldo guardado en ${BACKUP_DIR}"
            else
              echo "   (postgres aún no corre: primer despliegue, no hay nada que respaldar)"
            fi

            echo "▶ 4/6 Descargando imágenes"
            # Guarda las imágenes que corren HOY como ":rollback" (la etiqueta :latest ya fue sobrescrita por el build)
            OWNER_ENV=$(envget GITHUB_OWNER)
            for svc in backend frontend; do
              cid=$($COMPOSE ps -q "$svc" 2>/dev/null | head -1 || true)
              if [ -n "$cid" ]; then
                img=$(docker inspect --format '{{.Image}}' "$cid" 2>/dev/null || true)
                [ -n "$img" ] && docker tag "$img" "ghcr.io/${OWNER_ENV}/mano-${svc}:rollback" || true
              fi
            done
            PREV_TAG=$(cat .last_good_tag 2>/dev/null || true)
            if [ -z "$PREV_TAG" ]; then
              if docker image inspect "ghcr.io/${OWNER_ENV}/mano-backend:rollback" >/dev/null 2>&1; then PREV_TAG=rollback; else PREV_TAG=none; fi
            fi
            echo "   versión anterior para reversión: ${PREV_TAG}"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            export IMAGE_TAG="${DEPLOY_SHA}"
            $COMPOSE pull backend frontend

            echo "▶ 5/6 Levantando servicios"
            $COMPOSE up -d --remove-orphans

            echo "▶ 6/6 Verificando que el backend quede sano"
            OK=0
            for i in $(seq 1 30); do
              if $COMPOSE exec -T backend wget -qO- http://localhost:8080/api/health >/dev/null 2>&1; then OK=1; break; fi
              sleep 4
            done
            if [ "$OK" != 1 ]; then
              echo "❌ El backend no respondió. Últimos logs:"
              $COMPOSE logs --tail 60 backend || true
                if [ "${PREV_TAG}" = none ]; then
                echo "⚠️  No hay una versión anterior a la que volver (no había app corriendo)."
              else
                echo "↩  Reversión a la versión anterior (${PREV_TAG})"
                export IMAGE_TAG="${PREV_TAG}"
                $COMPOSE up -d --no-deps backend frontend || true
              fi
              exit 1
            fi
            echo "${DEPLOY_SHA}" > .last_good_tag
            docker image prune -f >/dev/null 2>&1 || true
            $COMPOSE ps
            echo "✅ Deploy completado — commit ${DEPLOY_SHA}"
            [ -n "${NGINX_CONF:-}" ] && echo "🌐 Abre: ${APP_BASE_URL}" || true
            REMOTE
            bash "$SCRIPT_FILE" < /dev/null
            RC=$?
            rm -f "$SCRIPT_FILE"
            exit $RC

      - name: Chequeo externo (la versión nueva está en línea)
        env:
          APP_URL: ${{ vars.APP_URL }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST || vars.AZURE_VM_HOST }}
        run: |
          BASE="${APP_URL:-http://${VM_HOST}}"
          echo "Comprobando ${BASE}"
          for i in $(seq 1 12); do
            h=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/api/health" || true)
            # /api/payments existe solo en la versión nueva: sin sesión debe responder 401 (la vieja daría 404)
            n=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/api/payments" || true)
            if [ "$h" = 200 ] && [ "$n" = 401 ]; then echo "✅ ${BASE}: health 200 y versión nueva activa (/api/payments 401)"; exit 0; fi
            echo "   intento $i: health=$h payments=$n"; sleep 5
          done
          echo "::error::${BASE} no muestra la versión nueva (health=$h, /api/payments=$n). El despliegue no quedó activo."
          exit 1
