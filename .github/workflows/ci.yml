name: CI

# Plan de migración F0.7. Se ejecuta en pull requests y a mano. NO despliega nada.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go build
        working-directory: backend
        run: go build ./...
      - name: go test
        working-directory: backend
        run: go test ./...

  web:
    name: Web (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        working-directory: web
        run: npm ci
      - name: TypeScript
        working-directory: web
        run: npx tsc --noEmit --incremental false
      - name: Build de producción
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  design-assets:
    name: Imágenes del diseñador intactas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar hashes contra el manifiesto (solo lectura)
        run: bash scripts/verify-design-assets.sh

  compose:
    name: Validar docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Config local
        run: docker compose -f docker-compose.local.yml config -q
      - name: Config producción actual
        env:
          GITHUB_OWNER: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
          JWT_SECRET: ci
          APP_BASE_URL: https://example.test
          DOMAIN: example.test
          WOMPI_PUBLIC_KEY: x
          WOMPI_PRIVATE_KEY: x
          WOMPI_INTEGRITY_SECRET: x
          WOMPI_EVENTS_SECRET: x
          SMTP_HOST: x
          SMTP_USER: x
          SMTP_PASS: x
          FROM_EMAIL: x@example.test
        run: docker compose -f docker-compose.prod.yml config -q

  api-tests:
    name: Pruebas de API (smoke + línea base)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar entorno local (backend + Postgres)
        run: docker compose -f docker-compose.local.yml up -d --build core postgres
      - name: Esperar al backend
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 2
          done
          docker compose -f docker-compose.local.yml logs core
          exit 1
      - name: Smoke (5 casos)
        run: bash scripts/smoke.sh
      - name: Suites de API en orden (BD recién sembrada)
        run: bash tests/api/run-all.sh --no-reset
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: tests/api/results/latest.tsv
      - name: Logs del backend si falla
        if: failure()
        run: docker compose -f docker-compose.local.yml logs core
