# docker-compose.local.yml — Entorno LOCAL de desarrollo para la migración (plan F0.4).
#
# Backend + Postgres + Web + proxy (mismo origen, como hoy). El gateway (F2), el web estático (F3),
# Redis y demás servicios laterales (F5) se agregan en sus fases. Este archivo NO es para producción.
#
# Navegar:  http://localhost:3000   (web + /api por el proxy)      API directa: http://localhost:8080/api
#
# Uso:  bash scripts/local-up.sh     (o)    docker compose -f docker-compose.local.yml up -d --build
# Datos de prueba: el backend siembra usuarios/negocios de demo al arrancar con la BD vacía.
# Pagos: MOCK_MODE=true (no se llama a Wompi). NUNCA poner claves reales aquí.

name: mano-local

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-mano}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-user} -d ${LOCAL_POSTGRES_DB:-mano}"]
      interval: 5s
      timeout: 5s
      retries: 20

  core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ":8080"
      DATABASE_DSN: postgres://${LOCAL_POSTGRES_USER:-user}:${LOCAL_POSTGRES_PASSWORD:-pass}@postgres:5432/${LOCAL_POSTGRES_DB:-mano}?sslmode=disable
      JWT_SECRET: ${LOCAL_JWT_SECRET:-local-dev-secret-change-me}
      MOCK_MODE: "true"
      SEED_DEMO_DATA: "true"   # usuarios/negocios de demostración (solo local y CI)
      APP_BASE_URL: ${LOCAL_APP_BASE_URL:-http://localhost:3000}
      GIN_MODE: debug
      # Wompi: vacío en local (MOCK_MODE). Para pruebas con sandbox, usar claves pub_test_/prv_test_ en .env.local
      WOMPI_PUBLIC_KEY: ${LOCAL_WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${LOCAL_WOMPI_PRIVATE_KEY:-}
      WOMPI_INTEGRITY_SECRET: ${LOCAL_WOMPI_INTEGRITY_SECRET:-}
      WOMPI_EVENTS_SECRET: ${LOCAL_WOMPI_EVENTS_SECRET:-}
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    ports:
      # Temporal (F0–F1): acceso directo al backend. Desde F2 solo el gateway queda expuesto.
      - "${LOCAL_CORE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
    restart: unless-stopped
    depends_on:
      - core
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Temporal: reemplaza al nginx de producción actual. Desaparece cuando exista el gateway (F2).
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LOCAL_WEB_PORT:-3000}:80"

volumes:
  postgres-data:
