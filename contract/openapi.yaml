        en cero).
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - customer
          - business_owner
          - freelancer
          - admin
        username:
          type: string
        document_id:
          type: string
        phone:
          type: string
        nequi_number:
          type: string
        is_verified:
          type: boolean
        plan:
          type: string
          enum:
          - free
          - pro
        plan_expires_at:
          type: string
          format: date-time
          nullable: true
        earnings_balance:
          type: number
          description: Saldo del comisionista en COP
        referral_code:
          type: string
        referred_by:
          type: integer
          format: int64
          nullable: true
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/Business'
          nullable: true
        stories:
          type: array
          items:
            $ref: '#/components/schemas/Story'
          nullable: true
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          nullable: true
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
          nullable: true
    WithdrawalRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        freelancer_id:
          type: integer
          format: int64
        amount:
          type: number
        nequi_number:
          type: string
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        processed_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
    WompiTransaction:
      type: object
      properties:
        id:
          type: string
        order_id:
          type: integer
          format: int64
          nullable: true
        user_id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
          description: Centavos COP
        currency:
          type: string
          example: COP
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - DECLINED
          - VOIDED
          - ERROR
        payment_method:
          type: string
        reference:
          type: string
        redirect_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
paths:
  /auth/signin:
    post:
      tags:
      - Auth
      operationId: authSignIn
      summary: Iniciar sesión
      description: 'Público. Devuelve el JWT (HS256, 72 h) y un resumen del usuario. El email se compara en minúsculas.

        Credenciales incorrectas y usuario inexistente dan el mismo 401 `invalid credentials`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: juan@example.com
              password: password123
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJyb2xlIjoiYnVzaW5lc3Nfb3duZXIi...
                user:
                  id: 1
                  name: Juan Pérez
                  email: juan@example.com
                  role: business_owner
        '400':
          description: Validación (`email` ausente/ inválido o `password` ausente) o JSON mal formado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Key: ''signInRequest.Email'' Error:Field validation for ''Email'' failed on the ''email'' tag'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid credentials
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/signup:
    post:
      tags:
      - Auth
      operationId: authSignUp
      summary: Registrar usuario
      description: "Público. Crea un usuario con rol `business_owner`, `freelancer` o `customer` (`admin` no se puede crear\
        \ aquí).\nNO devuelve token: hay que llamar después a `POST /auth/signin`.\n\nRarezas reales:\n- Todos los fallos\
        \ de `INSERT` (email duplicado, teléfono vacío duplicado, username duplicado, etc.) caen en\n  un único 400 genérico\
        \ `email already registered or invalid data`.\n- Teléfono duplicado (si se envía) da 400 `phone number already registered`.\n\
        - Roles aceptados: `business_owner`, `freelancer`, `customer`, `courier` (Domiciliario), `service_provider` (Prestación\
        \ de servicios).\n- Los mensajes de validación (`Key: 'signUpRequest.Password' Error:Field validation ...`) son texto\
        \ crudo del validador de Go.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              name: Contrato Core Uno
              email: core.uno@example.com
              password: password123
              role: customer
              phone: '3991110002'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
              example:
                id: 23
                email: core.uno@example.com
                role: customer
                username: contratocoreuno
        '400':
          description: 'Validación (campos requeridos, email inválido, `password` < 8, `role` fuera de `oneof`), JSON mal
            formado,

            teléfono ya registrado o email/username duplicado.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  value:
                    error: 'Key: ''signUpRequest.Password'' Error:Field validation for ''Password'' failed on the ''min''
                      tag'
                rol:
                  value:
                    error: 'Key: ''signUpRequest.Role'' Error:Field validation for ''Role'' failed on the ''oneof'' tag'
                duplicado:
                  value:
                    error: email already registered or invalid data
                telefono:
                  value:
                    error: phone number already registered
        '500':
          $ref: '#/components/responses/ServerError'
  /businesses:
    get:
      tags:
      - Negocios
      operationId: listBusinesses
      summary: Listar negocios aprobados
      description: 'Público. Solo `is_approved = true`. Sin paginación. Los filtros usan `ILIKE %valor%` (subcadena, sin distinguir

        mayúsculas; dependen de PostgreSQL). No filtra por `is_featured` ni ordena de forma garantizada.

        '
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Subcadena de `category` (ILIKE).
        example: caf
      - name: location
        in: query
        required: false
        schema:
          type: string
        description: Subcadena de `location` (ILIKE).
        example: centro
      responses:
        '200':
          description: Negocios (puede ser lista vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessListResponse'
              example:
                businesses:
                - id: 2
                  owner_id: 1
                  name: Artesanías Casa Nariño
                  slug: artesanias-casa-narino
                  description: Hamacas, mochilas y artesanías del Pacífico colombiano
                  category: Artesanías
                  location: Tumaco
                  address: Barrio El Morro 45
                  latitude: 1.8003
                  longitude: -78.7612
                  image_url: https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400
                  is_featured: false
                  is_approved: true
                  default_commission_rate: 0.2
                  monthly_limit: 0
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Negocios
      operationId: createBusiness
      summary: Crear negocio
      description: 'Requiere JWT con rol `business_owner` (validado en el handler; otros roles reciben 403).

        El negocio nace con `is_approved = false` hasta que un admin lo apruebe; mientras tanto no aparece en

        `GET /businesses` y no se le pueden crear productos. El `slug` se genera único a partir del nombre.

        Devuelve el `Business` DIRECTO (sin envolver). `default_commission_rate` fuera de 0.10–0.40 se corrige en

        silencio a 0.15 (no es error).

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
            example:
              name: Contrato Core Tienda
              description: Tienda del contrato core
              category: Pruebas
              location: Tumaco
      responses:
        '201':
          description: Negocio creado (pendiente de aprobación).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
              example:
                id: 8
                owner_id: 1
                name: Contrato Core Tienda
                slug: contrato-core-tienda
                description: Tienda del contrato core
                category: Pruebas
                location: Tumaco
                address: ''
                latitude: 0
                longitude: 0
                image_url: ''
                is_featured: false
                is_approved: false
                default_commission_rate: 0.15
                monthly_limit: 0
        '400':
          description: Validación (`name`, `description`, `category`, `location` requeridos) o JSON mal formado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Key: ''businessRequest.Description'' Error:Field validation for ''Description'' failed on the ''required''
                  tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El rol del token no es `business_owner`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: only business owners can create businesses
        '500':
          $ref: '#/components/responses/ServerError'
  /businesses/apply:
    post:
      tags:
      - Negocios
      operationId: applyBusiness
      summary: Enviar solicitud de registro de negocio (KYC)
      description: 'Requiere JWT; cualquier rol puede enviarla (el handler no valida rol). Crea una `BusinessApplication`
        en estado

        `pending`; la revisan los admins (`GET /admin/applications`). Solo se permite una solicitud `pending` por usuario

        (si ya hay una responde 400 `you already have a pending application`).


        Rareza: esta ruta es literal y convive con `/businesses/{id}`; Gin resuelve `apply` como ruta estática antes

        que como `{id}`, pero `GET /businesses/apply` NO existe como lista (cae en `GET /businesses/{id}` → 400 `invalid business
        id`).

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessApplyRequest'
            example:
              business_name: Contrato Core Negocio
              category: Pruebas
              description: Solicitud de contrato core
              nequi_number: '3991110002'
      responses:
        '201':
          description: Solicitud registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessApplyResponse'
              example:
                application:
                  id: 1
                  user_id: 23
                  business_name: Contrato Core Negocio
                  category: Pruebas
                  description: Solicitud de contrato core
                  nequi_number: '3991110002'
                  document_image_url: ''
                  status: pending
                  rejection_reason: ''
                  reviewed_by: null
                  reviewed_at: null
                  created_at: '2026-10-28T04:30:31.567471Z'
                message: Application submitted. Review takes 24-48 hours.
        '400':
          description: Validación (campos requeridos, JSON mal formado) o ya existe una solicitud pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pendiente:
                  value:
                    error: you already have a pending application
                validacion:
                  value:
                    error: 'Key: ''applyBusinessRequest.Category'' Error:Field validation for ''Category'' failed on the ''required''
                      tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /businesses/{id}:
    get:
      tags:
      - Negocios
      operationId: getBusiness
      summary: Detalle de negocio con sus productos
      description: 'Público. Devuelve `{business, products}` (productos duplicados, ver `BusinessDetailResponse`).

        INCONSISTENCIA: NO exige `is_approved` (un negocio pendiente se devuelve igual, con `products: []`) y devuelve

        TODOS los productos, incluidos `is_active=false` e `is_exclusive=true`. Para el catálogo filtrado usar

        `GET /businesses/{id}/products` o `GET /negocio/{slug}`.

        '
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Negocio y productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailResponse'
              example:
                business:
                  id: 3
                  owner_id: 1
                  name: Tienda de Prueba
                  slug: tienda-de-prueba
                  description: Descripción de prueba
                  category: Ropa
                  location: Tumaco
                  address: Calle 10
                  latitude: 1.801
                  longitude: -78.76
                  image_url: ''
                  is_featured: false
                  is_approved: false
                  default_commission_rate: 0.15
                  monthly_limit: 0
                products: []
        '400':
          description: '`id` no numérico.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid business id
        '404':
          description: Negocio inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: business not found
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Negocios
      operationId: patchBusiness
      summary: Editar negocio propio
      description: 'Requiere JWT con rol `business_owner` (403 en caso contrario) y ser el dueño (`owner_id`): si no, 403
        `not your business`.

        Actualización parcial: solo cambian los campos con valor (ver `BusinessPatchRequest`). Si cambia `name`, se

        regenera `slug` (el slug anterior deja de funcionar en `/negocio/{slug}`). Devuelve el `Business` DIRECTO

        recargado.


        Rarezas reales: un JSON mal formado NO da 400 (el error de `ShouldBindJSON` se ignora y se responde 200 con

        el negocio sin cambios); un cuerpo vacío tampoco falla. Puede editar negocios aún no aprobados.

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPatchRequest'
            example:
              description: Nueva desc core
              default_commission_rate: 0.25
      responses:
        '200':
          description: Negocio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
              example:
                id: 8
                owner_id: 1
                name: Contrato Core Tienda
                slug: contrato-core-tienda
                description: Nueva desc core
                category: Pruebas
                location: Tumaco
                address: ''
                latitude: 0
                longitude: 0
                image_url: ''
                is_featured: false
                is_approved: false
                default_commission_rate: 0.25
                monthly_limit: 0
        '400':
          description: '`id` no numérico.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Rol distinto de `business_owner`, o el negocio es de otro dueño.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rol:
                  value:
                    error: only business owners can edit businesses
                ajeno:
                  value:
                    error: not your business
        '404':
          description: Negocio inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: business not found
  /businesses/{id}/products:
    get:
      tags:
      - Negocios
      - Productos
      operationId: listBusinessProducts
      summary: Productos activos de un negocio
      description: 'Público con autenticación OPCIONAL. Mismo handler que `GET /products` con el filtro `business_id` tomado
        de la ruta.

        Solo `is_active = true`. Los productos `is_exclusive` se incluyen únicamente si el JWT enviado es de un usuario

        con `plan = pro` vigente; un token inválido se ignora en silencio (se trata como anónimo, no da 401).

        NO comprueba que el negocio exista ni esté aprobado: un `id` inexistente devuelve `{"products": []}` (200).

        Un `id` no numérico NO da 400: la consulta SQL falla y responde 500 `failed to list products`.

        Sin paginación.

        '
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Productos del negocio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              example:
                products:
                - id: 7
                  business_id: 1
                  name: Americano
                  description: Café americano suave
                  price: 3500
                  stock: 200
                  image_url: ''
                  commission_rate: 0.15
                  is_active: true
                  is_exclusive: false
        '500':
          description: Error interno (incluye `id` no numérico en la ruta).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: failed to list products
  /dashboard:
    get:
      tags:
      - Dashboards
      operationId: getBusinessDashboard
      summary: Resumen simple de órdenes e ingresos por negocio
      description: '**Rol: `business_owner`** (validado en el handler). Devuelve una fila por negocio del owner (aprobado
        o no).

        `orders`/`revenue` cuentan órdenes con status en (`pending`, `completed`, `delivered`): `pending` no es un status
        real

        (el real es `pending_payment`) y quedan fuera `paid`, `dispatched` e `in_transit`. Para métricas fiables usar

        `GET /dashboard/business/stats`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Resumen por negocio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDashboardResponse'
              example:
                dashboard:
                - business_id: 1
                  name: Café La Esquina
                  orders: 8
                  revenue: 68000
                - business_id: 2
                  name: Artesanías Casa Nariño
                  orders: 13
                  revenue: 1525000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No es business_owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: only business owners can view dashboard
        '500':
          $ref: '#/components/responses/ServerError'
  /dashboard/business/stats:
    get:
      tags:
      - Dashboards
      operationId: getBusinessDashboardStats
      summary: Estadísticas del negocio por período
      description: '**Rol: `business_owner`** (validado en el handler). Agrega TODOS los negocios del owner, solo órdenes
        con

        `payment_status = ''paid''`. Ventana: 30 días si `period=30d`; **cualquier otro valor (o ausente) usa 7 días**, y
        `period`

        se devuelve tal cual lo enviado (`?period=foo` => `"period": "foo"`).


        Rarezas: (1) `top_freelancers[].commission_earned` siempre es 0 (defecto de mapeo GORM). (2) Con negocios pero sin
        ventas los

        arrays pueden venir `null`. (3) Si el owner no tiene negocios la respuesta omite `period` y trae arrays vacíos.

        (4) `day` es un datetime a medianoche UTC, no `YYYY-MM-DD`.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: period
        in: query
        required: false
        description: '`7d` (default) o `30d`. Otros valores se aceptan sin error y equivalen a 7 días.'
        schema:
          type: string
          enum:
          - 7d
          - 30d
          default: 7d
      responses:
        '200':
          description: Estadísticas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDashboardStatsResponse'
              example:
                period: 7d
                sales_by_day:
                - day: '2026-10-28T00:00:00Z'
                  orders: 23
                  revenue: 1948500
                top_products:
                - product_id: 4
                  product_name: Hamaca Artesanal
                  quantity_sold: 7
                  revenue: 840000
                - product_id: 1
                  product_name: Espresso Doble
                  quantity_sold: 7
                  revenue: 31500
                top_freelancers:
                - freelancer_id: 3
                  freelancer_name: María García
                  sales: 7
                  commission_earned: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No es business_owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: only business owners can view stats
  /dashboard/freelancer:
    get:
      tags:
      - Dashboards
      operationId: getFreelancerDashboard
      summary: Ingresos y top productos del comisionista por período
      description: '**Rol: `freelancer`** (validado en el handler; un business_owner recibe 403). Solo órdenes con `payment_status
        = ''paid''`

        del comisionista. Ventana: 30 días si `period=30d`; **cualquier otro valor usa 7 días** y `period` se devuelve tal
        cual

        se envió. Sin ventas, `earnings_by_day` y `top_products` llegan como `null` (no `[]`). `day` es medianoche UTC en
        formato date-time.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: period
        in: query
        required: false
        description: '`7d` (default) o `30d`. Otros valores se aceptan sin error y equivalen a 7 días.'
        schema:
          type: string
          enum:
          - 7d
          - 30d
          default: 7d
      responses:
        '200':
          description: Dashboard del comisionista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreelancerDashboardResponse'
              examples:
                withSales:
                  value:
                    balance: 18000
                    earnings_by_day:
                    - day: '2026-10-28T00:00:00Z'
                      sales: 1
                      earnings: 24000
                    period: 30d
                    period_total: 24000
                    top_products:
                    - product_id: 4
                      product_name: Hamaca Artesanal
                      sales: 1
                      earned: 24000
                noSales:
                  value:
                    balance: 0
                    earnings_by_day: null
                    period: 7d
                    period_total: 0
                    top_products: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No es freelancer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: only freelancers can view this dashboard
  /health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Estado del servicio
      description: Sin autenticación. Solo responde `GET` (cualquier otro método devuelve el 404 de texto plano de Gin, no
        JSON).
      responses:
        '200':
          description: Servicio arriba.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /me:
    get:
      tags:
      - Usuario
      operationId: getMe
      summary: Perfil del usuario autenticado
      description: 'Requiere JWT (cualquier rol). Devuelve `{ "user": {...} }` con solo algunos campos de `User` poblados

        (ver `MeResponse`). Si el usuario fue borrado tras emitir el token, el handler no lo detecta y devuelve 200

        con un `user` en ceros (no verificado en vivo, deducido del código: el resultado de `First` se ignora).

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Usuario actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                user:
                  id: 1
                  name: Juan Pérez
                  email: juan@example.com
                  role: business_owner
                  username: juan
                  document_id: ''
                  phone: ''
                  nequi_number: ''
                  is_verified: true
                  plan: free
                  plan_expires_at: null
                  earnings_balance: 0
                  referral_code: ''
                  referred_by: null
        '401':
          description: Sin token, cabecera mal formada o token inválido/expirado.
          content:
            application/json:
              schema:
