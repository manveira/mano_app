  /sell/withdraw:
    post:
      tags:
      - Comisionistas
      operationId: sellWithdraw
      summary: Solicitar retiro del saldo a Nequi
      description: '**Rol: `freelancer`** (validado ANTES del body).


        Orden de validación real: rol (403) → body (400; `amount` `required,gt=0` y `nequi_number` `required`) →

        **saldo suficiente** (400 `insufficient balance` + campo extra `balance`) → **mínimo 5000 COP** (400).

        Consecuencia: con saldo 0 y `amount: 3000` se responde `insufficient balance`, no el mínimo.


        Efecto: descuenta el saldo inmediatamente y crea un `WithdrawalRequest` en estado `pending` (lo procesa un admin en

        `PATCH /admin/withdrawals/process/{id}`). No usa transacción: el descuento y la creación son pasos separados (con
        reversión

        manual si falla la creación).

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellWithdrawRequest'
            example:
              amount: 6000
              nequi_number: '3009990001'
      responses:
        '201':
          description: Solicitud creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellWithdrawResponse'
              example:
                message: Withdrawal request created. Processing in 1-2 business days.
                remaining_balance: 18000
                withdrawal:
                  id: 3
                  freelancer_id: 24
                  amount: 6000
                  nequi_number: '3009990001'
                  status: pending
                  processed_at: null
                  notes: ''
                  created_at: '2026-10-28T04:30:57.404653249Z'
        '400':
          description: 'Body inválido (mensaje crudo del validador), saldo insuficiente (con `balance`) o monto menor a 5000.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/SellInsufficientBalanceError'
              examples:
                missingNequi:
                  value:
                    error: 'Key: ''withdrawalRequest.NequiNumber'' Error:Field validation for ''NequiNumber'' failed on the
                      ''required'' tag'
                zeroAmount:
                  value:
                    error: 'Key: ''withdrawalRequest.Amount'' Error:Field validation for ''Amount'' failed on the ''required''
                      tag'
                negativeAmount:
                  value:
                    error: 'Key: ''withdrawalRequest.Amount'' Error:Field validation for ''Amount'' failed on the ''gt'' tag'
                insufficientBalance:
                  value:
                    error: insufficient balance
                    balance: 24000
                belowMinimum:
                  value:
                    error: minimum withdrawal is $5.000 COP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No es freelancer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: only freelancers can request withdrawals
        '500':
          $ref: '#/components/responses/ServerError'
  /vendedor/{username}:
    get:
      tags:
      - Comisionistas
      operationId: getFreelancerStorefront
      summary: Vitrina pública de un comisionista
      description: '**Público.** Busca `username` EXACTO (distingue mayúsculas) con `role = ''freelancer''`: un username de
        otro rol responde 404

        igual que uno inexistente. Lista sus links activos cuyo producto está activo, con `referral_url` (`APP_BASE_URL` +
        `/r/` + slug).

        Sin productos => `products: []`. No expone email, saldo ni plan.

        '
      parameters:
