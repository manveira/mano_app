    SellWithdrawRequest:
      type: object
      required:
      - amount
      - nequi_number
      properties:
        amount:
          type: number
          description: 'COP. Validación gin: `required,gt=0` (0 o ausente => error de `required`; negativo => error de `gt`).

            Después, en orden: saldo suficiente (400 `insufficient balance`) y luego mínimo 5000 (400).

