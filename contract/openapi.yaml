            username:
              type: string
              example: maria
        products:
          type: array
          description: Solo links activos con producto activo. Sin ninguno => `[]`. No se ordena de forma garantizada.
          items:
            $ref: '#/components/schemas/SellStorefrontProduct'
    SellUpgradeProResponse:
