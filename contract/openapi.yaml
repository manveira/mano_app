              example:
                error: failed to list products
    post:
      tags:
      - Productos
      operationId: createProduct
      summary: Crear producto
      description: 'Requiere JWT con rol `business_owner`, dueño del negocio `business_id`, y negocio YA aprobado.

        El producto nace con `is_active = true`. Devuelve el `Product` DIRECTO.


        Orden de comprobación (importa para el código): rol (403) → validación del cuerpo (400) → negocio existe (404)

        → es del usuario (403) → está aprobado (403 `business is not approved yet`) → `commission_rate` en rango (400).

        `stock: 0` y `price: 0` son rechazados por `binding:"required"` (400), ver `ProductCreateRequest`.

        Si `commission_rate` falta/0 se hereda `default_commission_rate` del negocio.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            example:
              business_id: 1
              name: Contrato Core Producto
              description: Producto contrato core
              price: 1000
              stock: 3
      responses:
        '201':
          description: Producto creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 27
                business_id: 1
                name: Contrato Core Producto
                description: Producto contrato core
                price: 1000
                stock: 3
                image_url: ''
                commission_rate: 0.15
                is_active: true
                is_exclusive: false
        '400':
          description: Validación del cuerpo, JSON mal formado o `commission_rate` fuera de 0.10–0.40.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  value:
                    error: 'Key: ''productRequest.Stock'' Error:Field validation for ''Stock'' failed on the ''required''
                      tag'
                comision:
                  value:
                    error: commission_rate must be between 10% and 40%
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Rol distinto de `business_owner`, negocio de otro dueño, o negocio sin aprobar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rol:
                  value:
                    error: only business owners can create products
                ajeno:
                  value:
                    error: you can only add products to your own business
                sinAprobar:
                  value:
                    error: business is not approved yet
        '404':
          description: El negocio `business_id` no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: business not found
        '500':
          $ref: '#/components/responses/ServerError'
  /products/{id}:
    patch:
      tags:
      - Productos
      operationId: patchProduct
      summary: Activar/desactivar producto propio
      description: 'Requiere JWT con rol `business_owner` y ser dueño del negocio del producto. SOLO permite cambiar `is_active`

        (otros campos del cuerpo se ignoran: no hay forma de editar precio, stock o nombre). Al cambiar `is_active`

        se sincronizan los `ReferralLink` del producto. Devuelve el `Product` DIRECTO.

        Un cuerpo vacío (sin JSON) da 400 (EOF), pero `{}` es válido y devuelve 200 sin cambios.

        Orden: rol (403) → `id` numérico (400) → cuerpo JSON (400) → producto existe (404) → ownership (403).

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatchRequest'
            example:
              is_active: false
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 27
                business_id: 1
                name: Contrato Core Producto
                description: Producto contrato core
                price: 1000
                stock: 3
                image_url: ''
                commission_rate: 0.15
                is_active: false
                is_exclusive: false
        '400':
          description: '`id` no numérico o JSON inválido/ausente.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                id:
                  value:
                    error: invalid product id
                json:
                  value:
                    error: invalid character 'b' looking for beginning of value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Rol distinto de `business_owner` o el producto es de otro dueño.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rol:
                  value:
                    error: only business owners can update products
                ajeno:
                  value:
                    error: you can only update your own products
        '404':
          description: Producto inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: product not found
  /r/{slug}:
    get:
      tags:
      - Referidos
      operationId: trackReferralClick
      summary: Resolver un link de referido (registra un click)
      description: '**Público. GET CON EFECTO SECUNDARIO:** cada llamada válida inserta un `ReferralClick` (IP + User-Agent)
        e incrementa

        `clicks` del link (sin deduplicar; ni caché ni prefetch son seguros). Verificado: 2 llamadas => `clicks: 2`.


        **No redirige:** responde 200 con JSON del producto; el frontend decide a dónde navegar. Los dos 400 llevan el mismo
        mensaje

        (link inactivo y producto inactivo) y no registran click. La ruta del navegador del web es `/r/{slug}` (APP_BASE_URL),
        pero

        este endpoint vive en el API. Con el seed: `hamaca-casa-narino-maria-x7k2`.

