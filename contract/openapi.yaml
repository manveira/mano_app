          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payments/wompi/sync:
    post:
      tags:
      - Pagos
      operationId: syncWompiPayment
      summary: Verificar con Wompi los pagos pendientes de una orden
      description: 'Se llama al volver del checkout. El **servidor** consulta a Wompi (llave privada) y aplica el resultado;
        el cliente nunca

        decide el estado. Solo el comprador de la orden (otro usuario → 403). Máximo una consulta por orden cada 5 s (429).

        503 si el servidor no tiene verificación configurada o Wompi no responde.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPaymentRequest'
      responses:
        '200':
          description: Estado actual de la orden y de sus pagos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Demasiadas verificaciones seguidas de la misma orden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Verificación no configurada o Wompi no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/{reference}:
