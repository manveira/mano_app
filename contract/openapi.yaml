        user:
          $ref: '#/components/schemas/SignInUser'
    SignInUser:
      type: object
      description: Resumen del usuario devuelto en el login (4 campos, no el modelo `User`).
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - customer
          - business_owner
          - freelancer
          - courier
          - service_provider
          - admin
    SignUpRequest:
      type: object
      description: 'Etiquetas `binding` del backend. `role` NO admite `admin`. `password` mínimo 8 caracteres.

        Si `username` falta se genera a partir de `name` (minúsculas, sin espacios, con sufijo numérico si ya existe).

        `referral_code` desconocido se ignora en silencio. `phone`, si viene, debe ser único.

        '
      required:
      - name
      - email
      - password
      - role
      properties:
        name:
          type: string
          example: Contrato Core Uno
        email:
          type: string
          format: email
          example: core.uno@example.com
          description: Se guarda en minúsculas
        password:
          type: string
          minLength: 8
          example: password123
        role:
          type: string
          enum:
          - business_owner
          - freelancer
          - customer
          - courier
          - service_provider
          description: courier = Domiciliario, service_provider = Prestación de servicios (añadidos en v1.1, aditivo)
        phone:
          type: string
          example: '3991110002'
          description: 'Opcional. Si viene, debe ser único. Registrarse SIN teléfono ya no tiene límite (hallazgo #18 corregido:

            el índice único ignora la cadena vacía).

            '
        document_id:
          type: string
          description: Cédula; usada por el anti-fraude comprador = comisionista
        nequi_number:
          type: string
        username:
          type: string
          example: coredos
          description: 'Opcional. Se normaliza (minúsculas, sin espacios laterales) y debe cumplir 3–30 caracteres [a-z0-9._-];
            si no, 400 ''invalid username ...''. Duplicado: 400 ''username already taken''.'
        referral_code:
          type: string
          description: Código de quien invitó (de `GET /sell/referral-code` o el campo `referral_code` de otro usuario)
    SignUpResponse:
      type: object
      description: Respuesta mínima y NO el modelo `User` completo (no devuelve `name`, `phone`, `referral_code`, etc.).
      properties:
        id:
          type: integer
          format: int64
          example: 23
        email:
          type: string
          format: email
          description: En minúsculas
        role:
          type: string
          enum:
          - business_owner
          - freelancer
          - customer
          - courier
          - service_provider
          description: courier = Domiciliario, service_provider = Prestación de servicios (añadidos en v1.1, aditivo)
        username:
          type: string
          example: contratocoreuno
