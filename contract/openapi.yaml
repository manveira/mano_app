        product_name:
          type: string
        clicks:
          type: integer
        conversions:
          type: integer
        conversion_rate_pct:
          type: number
          description: conversions / clicks * 100 (0 si clicks = 0, aunque haya conversiones). Puede superar 100.
        earned_total:
          type: number
          description: Estimado = conversions × price × commission_rate (con el precio/tasa ACTUALES del producto, no con
            lo realmente pagado).
    SellLinksResponse:
