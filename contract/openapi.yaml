              items:
                $ref: '#/components/schemas/Advertisement'
            local_businesses:
              type: array
              description: 'Los primeros 20 negocios de la tabla (sin ORDER BY, sin filtrar `is_approved`). Si llegan `latitude`
                y

                `longitude` numéricas se conservan solo los que están a ≤ 10 km y con coordenadas distintas de (0,0);

                si ninguno cumple llega `[]`.

                '
              items:
                $ref: '#/components/schemas/Business'
    ReferralLink:
      type: object
