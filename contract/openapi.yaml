          - release_business
          description: '- `refund_buyer`: orden `cancelled`, escrow `refunded`, pago `refunded`; los splits `pending` pasan
            a `failed`.

            - `release_business`: orden `delivered`, escrow `released`; se liberan los splits (escrow normal).

            '
        notes:
          type: string
          description: Se acepta pero NO se guarda ni se devuelve.
    ResolveDisputeResponse:
      type: object
      required:
      - message
      - status
      - escrow_status
      properties:
        message:
          type: string
          description: '"Dispute resolved" (refund_buyer) o "Dispute resolved: payment released to business" (release_business).'
        status:
          type: string
          enum:
          - cancelled
          - delivered
        escrow_status:
          type: string
          enum:
          - refunded
          - released
        payment_status:
          type: string
          description: Solo presente con `refund_buyer` (`refunded`). Con `release_business` la propiedad no existe.
    SellAffiliateRequest:
      type: object
      required:
      - product_id
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
          description: 'ID del producto. Se bindea a `uint`: un string o un negativo falla el JSON (400 con mensaje de Go).

            `0` también falla (`required` de gin trata el cero como ausente).

            '
    SellAffiliateResponse:
      type: object
      description: 'Respuesta de `POST /sell/affiliate`. Tiene DOS formas según el caso:

        - **201** (link nuevo): `referral_link` + `url` (sin `message`).

        - **200** (ya afiliado): `referral_link` + `message: "already affiliated"` (sin `url`).

        En ambos casos `referral_link.freelancer` y `referral_link.product` vienen con valores cero (`id: 0`), no precargados.

        '
      required:
      - referral_link
      properties:
        referral_link:
          $ref: '#/components/schemas/ReferralLink'
        url:
          type: string
          description: Solo en 201. `APP_BASE_URL` + `/r/` + slug (en local `http://localhost:3000`; por defecto `https://mano.app`).
          example: http://localhost:3000/r/hamaca-artesanal-24-kgz1
        message:
          type: string
          description: Solo en 200.
          example: already affiliated
    SellInsufficientBalanceError:
      type: object
      description: Único error del backend que añade un campo extra además de `error`.
      required:
      - error
      - balance
      properties:
        error:
          type: string
          example: insufficient balance
        balance:
          type: number
          description: Saldo actual del comisionista.
          example: 24000
    SellLink:
      description: ReferralLink con `url` añadido (struct embebido en Go). `product` viene precargado; `freelancer` viene
