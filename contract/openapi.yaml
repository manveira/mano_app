# GENERADO por contract/build.py a partir de contract/src/. NO EDITAR A MANO.
openapi: 3.0.3
info:
  title: Mano App API
  version: 1.0.0-draft
  description: "Contrato del API de Mano App (marketplace local: negocios, comisionistas y compradores).\n\n**Este contrato\
    \ describe el comportamiento REAL del backend actual (Go/Gin) tal cual es, incluidas sus\ninconsistencias.** Una vez congelado\
    \ (`contract-v1.0.0`) solo se permiten cambios aditivos; los cambios\nincompatibles van a `/v2`.\n\n## Acceso\nTodos los\
    \ clientes (web, iOS, Android) hablan **solo con el API Gateway**: `https://api.mano.app/v1`.\nEn local: gateway `http://localhost:8000/v1`;\
    \ backend directo (temporal) `http://localhost:8080/api`.\n\n## Headers de cliente (los envía todo cliente; el gateway\
    \ los usa, el backend actual los ignora)\n| Header | Valor | Uso |\n|---|---|---|\n| `X-Mano-Client` | `web` \\| `ios`\
    \ \\| `android` | métricas, límites por plataforma |\n| `X-Mano-Client-Version` | semver, p. ej. `1.4.2` | el gateway\
    \ responde `426` si es inferior al mínimo |\n| `X-Mano-Build` | número de build (móviles) | diagnóstico |\n| `X-Mano-Device-Id`\
    \ | UUID de la instalación | límites por dispositivo, anti-abuso |\n| `X-Request-Id` | UUID (opcional) | trazabilidad\
    \ |\n\nLos headers de cliente **no autorizan**: son falsificables. La autorización es el JWT.\n\n## Convenciones reales\
    \ del backend (no se \"arreglan\" en v1)\n- JSON en `snake_case`. Montos en COP como número (`float64`); en `WompiTransaction.amount`\
    \ están en centavos.\n- Errores: `{\"error\": \"mensaje\"}` con el código HTTP correspondiente.\n- Respuestas **inconsistentes**:\
    \ unas listas vienen envueltas (`{\"businesses\":[...]}`), unos recursos envueltos\n  (`{\"order\":{...}}`) y otros directos\
    \ (`POST /orders` devuelve la orden sin envolver).\n- Las listas vacías pueden llegar como `null` (no `[]`): los clientes\
    \ deben tolerarlo.\n- Los structs anidados de GORM (`business`, `delivery`, `product`, …) están **siempre presentes**\
    \ en el JSON de\n  `Order`/`OrderItem`/`ReferralLink`, con valores cero (`id: 0`) cuando no fueron precargados.\n- Fechas\
    \ ISO-8601 (`2026-10-27T10:00:00Z`). Una fecha sin asignar llega como `0001-01-01T00:00:00Z`.\n- Autenticación: `Authorization:\
    \ Bearer <JWT>` (HS256, 72 h). Roles: `customer`, `business_owner`, `freelancer`, `admin`.\n"
  contact:
    name: Mano App
servers:
- url: http://localhost:8000/v1
  description: Gateway local (a partir de la fase F2)
- url: http://localhost:8080/api
  description: Backend directo local (temporal, hasta F2)
- url: https://api.mano.app/v1
  description: Producción (fase F8)
tags:
- name: Health
- name: Auth
- name: Usuario
- name: Negocios
- name: Productos
- name: Órdenes
- name: Pagos
- name: Entregas
- name: Comisionistas
- name: Referidos
- name: Dashboards
- name: Social
- name: Publicidad
- name: Mapa
- name: Admin
- name: Webhooks
security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 obtenido en `POST /auth/signin` (72 h).
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Petición inválida (validación, JSON mal formado, regla de negocio).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Falta el token, es inválido o expiró.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol o la propiedad del recurso no permiten la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Error interno.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AdminApplicationsResponse:
      type: object
      required:
      - applications
      - count
      properties:
        applications:
          type: array
          description: Solicitudes con `status = pending`, de la más antigua a la más reciente.
          items:
            $ref: '#/components/schemas/BusinessApplication'
        count:
          type: integer
          minimum: 0
    AdminApproveBusinessResponse:
      type: object
      required:
      - message
      - business_id
      properties:
        message:
          type: string
          example: business approved
        business_id:
          type: integer
          format: int64
    AdminDisputesResponse:
      type: object
      required:
      - disputes
      - count
      properties:
        disputes:
          type: array
          description: 'Órdenes con `status = disputed`, de la más reciente a la más antigua. Cada `items[].product` viene
            precargado;

            `business` y `delivery` llegan siempre con valores cero (`id: 0`); `customer_id`, `freelancer_id`,

            `referral_link_id`, `items` y `commission_splits` pueden faltar (omitempty).

            '
          items:
            $ref: '#/components/schemas/Order'
        count:
          type: integer
          minimum: 0
    AdminPendingBusinessesResponse:
      type: object
      required:
      - businesses
      - count
      properties:
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/Business'
        count:
          type: integer
          minimum: 0
    AdminProcessWithdrawalResponse:
      type: object
      required:
      - message
      - id
      properties:
        message:
          type: string
          example: withdrawal processed
        id:
          type: integer
          format: int64
    AdminRejectBusinessRequest:
      type: object
      description: Cuerpo opcional. Un JSON mal formado o ausente se ignora silenciosamente (`reason` queda vacío).
      properties:
        reason:
          type: string
          example: Documentos ilegibles
    AdminRejectBusinessResponse:
      type: object
      required:
      - message
      - business_id
      - reason
      properties:
        message:
          type: string
          example: business rejected
        business_id:
          type: integer
          format: int64
        reason:
          type: string
          description: Eco del `reason` recibido (cadena vacía si no se envió). NO se persiste en ningún lado.
    AdminWithdrawalsResponse:
      type: object
      required:
      - withdrawals
      - count
      properties:
        withdrawals:
          type: array
          description: Retiros con `status = pending`, del más antiguo al más reciente.
          items:
            $ref: '#/components/schemas/WithdrawalRequest'
        count:
          type: integer
          minimum: 0
    Advertisement:
      type: object
      properties:
        id:
          type: integer
          format: int64
        business_id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
        package_type:
          type: string
          example: Paquete básico
        active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    AdvertisementsResponse:
      type: object
      required:
      - advertisements
      properties:
        advertisements:
          type: array
          items:
            $ref: '#/components/schemas/Advertisement'
    AdvertisingPackage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
        duration_days:
          type: integer
        active:
          type: boolean
    Business:
      type: object
      properties:
        id:
          type: integer
          format: int64
        owner_id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        image_url:
          type: string
        is_featured:
          type: boolean
        is_approved:
          type: boolean
        default_commission_rate:
          type: number
          description: Fracción 0.10–0.40
        monthly_limit:
          type: integer
          description: Unidades por mes; 0 = sin límite
        advertisements:
          type: array
          items:
            $ref: '#/components/schemas/Advertisement'
          nullable: true
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          nullable: true
    BusinessApplication:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        business_name:
          type: string
        category:
          type: string
        description:
          type: string
        nequi_number:
          type: string
        document_image_url:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        rejection_reason:
          type: string
        reviewed_by:
          type: integer
          format: int64
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    BusinessApplyRequest:
      type: object
      required:
      - business_name
      - category
      - description
      - nequi_number
      properties:
        business_name:
          type: string
          example: Contrato Core Negocio
        category:
          type: string
        description:
          type: string
        nequi_number:
          type: string
        document_image_url:
          type: string
          description: URL de la foto del RUT/cédula (opcional)
    BusinessApplyResponse:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/BusinessApplication'
        message:
          type: string
          example: Application submitted. Review takes 24-48 hours.
    BusinessCreateRequest:
      type: object
      required:
      - name
      - description
      - category
      - location
      properties:
        name:
          type: string
          example: Contrato Core Tienda
        description:
          type: string
        category:
          type: string
        location:
          type: string
          example: Tumaco
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        image_url:
          type: string
        default_commission_rate:
          type: number
          description: Fracción 0.10–0.40. Fuera de rango (o ausente) se reemplaza SIN error por 0.15.
        monthly_limit:
          type: integer
          description: Unidades por mes; 0 = sin límite
    BusinessDashboardEntry:
      type: object
      required:
      - business_id
      - name
      - orders
      - revenue
      properties:
        business_id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: integer
          format: int64
          description: Órdenes con status en (`pending`, `completed`, `delivered`). NOTA - `pending` no es un status real
            de orden (es `pending_payment`) y se excluyen `paid`/`dispatched`/`in_transit`.
        revenue:
          type: number
          description: Suma de `total_amount` de esas mismas órdenes.
    BusinessDashboardResponse:
      type: object
      required:
      - dashboard
      properties:
        dashboard:
          type: array
          description: Un elemento por negocio del owner (incluye no aprobados). Sin negocios => `[]`.
          items:
            $ref: '#/components/schemas/BusinessDashboardEntry'
    BusinessDashboardStatsResponse:
      type: object
      description: 'Los arrays pueden ser `null` cuando el negocio existe pero no hay filas (Scan sobre slice nil). Si el
        owner no

        tiene negocios, el backend responde `{sales_by_day: [], top_products: [], top_freelancers: []}` y **omite `period`**.

        Solo cuentan órdenes con `payment_status = ''paid''`.

        '
      required:
      - sales_by_day
      - top_products
      - top_freelancers
      properties:
        period:
          type: string
          description: Eco literal del query `period` (por defecto `7d`); NO se normaliza (`?period=foo` devuelve `foo` con
            ventana de 7 días). Ausente si el owner no tiene negocios.
          example: 7d
        sales_by_day:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/BusinessStatsDaySale'
        top_products:
          type: array
          nullable: true
          description: Top 5 por cantidad vendida.
          items:
            $ref: '#/components/schemas/BusinessStatsTopProduct'
        top_freelancers:
          type: array
          nullable: true
          description: Top 5 por número de ventas.
          items:
            $ref: '#/components/schemas/BusinessStatsTopFreelancer'
    BusinessDetailResponse:
      type: object
      description: 'INCONSISTENCIA: `products` aparece duplicado — dentro de `business.products` (precarga GORM, omitido si
        está

        vacío) y en el nivel superior. No filtra por `is_approved` ni por `is_active`/`is_exclusive`: devuelve TODOS

        los productos (activos, inactivos, exclusivos Pro) de cualquier negocio, incluso no aprobado.

        '
      properties:
        business:
          $ref: '#/components/schemas/Business'
        products:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Product'
    BusinessListResponse:
      type: object
      description: Lista envuelta. Los `Business` de listas NO traen `products` ni `advertisements` (omitidos por `omitempty`).
      properties:
        businesses:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Business'
    BusinessPatchRequest:
      type: object
      description: 'Todos los campos son opcionales; solo se actualizan los que traen valor distinto del cero del tipo

        (`""` o fuera de rango = "no cambiar"). Imposible vaciar un texto. `latitude`, `longitude`, `category`,

        `monthly_limit` y `is_approved` NO son editables por este endpoint (se ignoran).

        '
      properties:
        name:
          type: string
          description: Si cambia
          se regenera `slug` (único): null
        description:
          type: string
        image_url:
          type: string
        default_commission_rate:
          type: number
          description: Solo se aplica si está entre 0.10 y 0.40 (inclusive); si no
          se ignora en silencio: null
        address:
          type: string
        location:
          type: string
    BusinessPublicProfileResponse:
      type: object
      description: Perfil público por slug. Solo negocios aprobados; los productos son los `is_active` (incluye exclusivos
        Pro, sin filtrar).
      properties:
        business:
          $ref: '#/components/schemas/Business'
        products:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Product'
        stats:
          $ref: '#/components/schemas/BusinessPublicStats'
        slug:
          type: string
          description: Eco del parámetro de ruta
    BusinessPublicStats:
      type: object
      properties:
        total_orders:
          type: integer
          format: int64
          description: Órdenes con `payment_status = paid`
        total_revenue:
          type: number
          description: Suma de `total_amount` de esas órdenes (COP)
    BusinessStatsDaySale:
      type: object
      required:
      - day
      - orders
      - revenue
      properties:
        day:
          type: string
          format: date-time
          description: Día (agrupado por `DATE(created_at)`) serializado como medianoche UTC, p. ej. `2026-10-28T00:00:00Z`
            (no es una fecha `YYYY-MM-DD`).
        orders:
          type: integer
          format: int64
        revenue:
          type: number
    BusinessStatsTopFreelancer:
      type: object
      required:
      - freelancer_id
      - freelancer_name
      - sales
      - commission_earned
      properties:
        freelancer_id:
          type: integer
          format: int64
        freelancer_name:
          type: string
        sales:
          type: integer
          format: int64
        commission_earned:
          type: number
          description: 'DEFECTO CONOCIDO: siempre 0. El SQL usa el alias `commission_earned` y el struct Go tiene el campo
            `Commission`, por lo que GORM no lo mapea.'
          example: 0
    BusinessStatsTopProduct:
      type: object
      required:
      - product_id
      - product_name
      - quantity_sold
      - revenue
      properties:
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        quantity_sold:
          type: integer
          format: int64
        revenue:
          type: number
    CommissionSplit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        recipient_type:
          type: string
          enum:
          - business
          - freelancer
          - platform
        recipient_id:
          type: integer
          format: int64
          nullable: true
        amount:
          type: number
        percentage:
          type: number
        status:
          type: string
          enum:
          - pending
          - released
          - failed
        released_at:
          type: string
          format: date-time
          nullable: true
    CreateAdvertisementRequest:
      type: object
      required:
      - business_id
      - title
      - description
      - package_type
      properties:
        business_id:
          type: integer
          format: int64
          minimum: 1
          description: Negocio propio del usuario autenticado.
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        image_url:
          type: string
        package_type:
          type: string
          minLength: 1
          description: 'Texto libre (no se valida contra `AdvertisingPackage`). Solo los valores exactos "Paquete destacado",

            "Paquete premium" y "Paquete básico" reciben prioridad en `GET /feed`.

            '
          example: Paquete premium
        active:
          type: boolean
          default: false
          description: Si se omite queda en `false` y el anuncio no aparece en `/ads`, `/feed` ni `/recommendations`.
    CreateStoryRequest:
      type: object
      required:
      - title
      - content
      properties:
        title:
          type: string
          minLength: 1
          example: Historia contrato social 1
        content:
          type: string
          minLength: 1
          example: Contenido único
        media_url:
          type: string
          example: https://example.com/a.jpg
      description: '`expires_at` y `user_id` NO se aceptan del cliente: `user_id` sale del JWT y `expires_at` nunca se asigna.

        Cualquier propiedad adicional se ignora.

        '
    Delivery:
      type: object
      properties:
        id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        courier_id:
          type: integer
          format: int64
          nullable: true
        type:
          type: string
          enum:
          - business_own
          - mano_courier
        status:
          type: string
          enum:
          - scheduled
          - picked_up
          - in_transit
          - delivered
          - failed
        eta:
          type: string
        tracking:
          type: string
        picked_up_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: invalid credentials
    FeedResponse:
      type: object
      description: Feed público. Historias vigentes + anuncios activos ordenados por prioridad de paquete.
      required:
      - stories
      - advertisements
      properties:
        stories:
          type: array
          description: Historias con `expires_at > now` (o NULL), de la más reciente a la más antigua (`created_at DESC`).
          items:
            $ref: '#/components/schemas/Story'
        advertisements:
          type: array
          description: 'Anuncios con `active = true`. Orden: "Paquete destacado" → "Paquete premium" → "Paquete básico" →
            cualquier otro

            `package_type`. Dentro de una misma prioridad el orden NO está garantizado como estable (se ordena en memoria
            con

            un intercambio simple; de partida vienen por `created_at DESC`).

            '
          items:
            $ref: '#/components/schemas/Advertisement'
    FreelancerDashboardResponse:
      type: object
      description: Solo órdenes con `payment_status = 'paid'` y `freelancer_id` del usuario.
      required:
      - period
      - earnings_by_day
      - top_products
      - balance
      - period_total
      properties:
        period:
          type: string
          description: Eco literal del query `period` (por defecto `7d`); cualquier valor distinto de `30d` usa ventana de
            7 días.
          example: 7d
        earnings_by_day:
          type: array
          nullable: true
          description: '`null` (no `[]`) si no hubo ventas en el período.'
          items:
            $ref: '#/components/schemas/FreelancerEarningDay'
        top_products:
          type: array
          nullable: true
          description: Top 5 por ventas. `null` si no hubo ventas.
          items:
            $ref: '#/components/schemas/FreelancerTopProduct'
        balance:
          type: number
          description: Saldo actual (`earnings_balance`).
        period_total:
          type: number
          description: Suma de `freelancer_commission` en el período.
    FreelancerEarningDay:
      type: object
      required:
      - day
      - sales
      - earnings
      properties:
        day:
          type: string
          format: date-time
          description: Medianoche UTC del día (ver `BusinessStatsDaySale.day`).
        sales:
          type: integer
          format: int64
        earnings:
          type: number
          description: Suma de `freelancer_commission` del día
    FreelancerTopProduct:
      type: object
      required:
      - product_id
      - product_name
      - sales
      - earned
      properties:
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        sales:
          type: integer
          format: int64
        earned:
          type: number
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    MeResponse:
      type: object
      description: 'Usuario envuelto en `user`. Solo se seleccionan `id, name, email, role, username, plan, plan_expires_at,

        earnings_balance, is_verified`; los demás campos de `User` (`document_id`, `phone`, `nequi_number`,

        `referred_by`) llegan vacíos. Desde v1.1 `document_id`, `phone`, `nequi_number` y `referral_code` SÍ vienen

        con su valor (son datos del propio usuario).

        '
      properties:
        user:
          $ref: '#/components/schemas/User'
    Movement:
      type: object
      properties:
        type:
          type: string
          enum:
          - commission
          - withdrawal
        title:
          type: string
        amount:
          type: number
          description: COP. Positivo = ingreso, negativo = egreso
        status:
          type: string
          enum:
          - released
          - pending
          - processing
          - completed
          - failed
        order_id:
          type: integer
          format: int64
          description: Solo en comisiones
        created_at:
          type: string
          format: date-time
    MovementsResponse:
      type: object
      properties:
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
    NearbyBusinessesResponse:
      type: object
      required:
      - businesses
      properties:
        businesses:
          type: array
          nullable: true
          description: 'Negocios (aprobados o no). Sin `latitude`+`longitude`: todos los negocios (`[]` si no hay ninguno).

            Con coordenadas: los que están dentro de `radius_km`; si ninguno coincide llega `null` (no `[]`).

            '
          items:
            $ref: '#/components/schemas/Business'
    Order:
      type: object
