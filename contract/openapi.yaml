    ProductCreateRequest:
      type: object
      description: 'OJO con `binding:"required"` de Go: un número igual a 0 se considera ausente, así que `stock: 0` se rechaza
        con 400

        aunque la regla diga `gte=0` (no se puede crear un producto sin stock).

        '
      required:
      - business_id
      - name
      - description
      - price
      - stock
      properties:
        business_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        description:
          type: string
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: COP
          debe ser > 0: null
        stock:
          type: integer
          minimum: 1
          description: En la práctica ≥ 1 (0 es rechazado por `required`)
        image_url:
          type: string
        commission_rate:
          type: number
          description: 'Fracción 0.10–0.40. Si falta o es 0 se usa `default_commission_rate` del negocio. Si viene fuera de
            rango

            responde 400 (a diferencia de `POST /businesses`, que corrige en silencio).

            '
        is_exclusive:
          type: boolean
          default: false
    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Product'
    ProductPatchRequest:
      type: object
      description: 'Solo `is_active` tiene efecto; cualquier otro campo se ignora. Al cambiar `is_active` también se sincroniza

        `is_active` de todos los `ReferralLink` del producto. Un objeto `{}` es válido y no cambia nada (200).

        '
      properties:
        is_active:
          type: boolean
          nullable: true
    PurchasePackageRequest:
      type: object
