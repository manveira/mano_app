        los `is_exclusive` solo para usuarios con plan Pro vigente. No exige que el negocio esté aprobado.

        Sin paginación. El filtro `business_id` no numérico produce 500 (fallo SQL), no 400.

        '
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: business_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Filtra por negocio (sin validar que exista).
      responses:
        '200':
          description: Productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              example:
                products:
                - id: 3
                  business_id: 1
                  name: Latte Macchiato
                  description: Latte con arte decorativo
                  price: 6000
                  stock: 79
                  image_url: https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=300
                  commission_rate: 0.15
                  is_active: true
                  is_exclusive: false
