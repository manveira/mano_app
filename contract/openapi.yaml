        los borra.

        Se ignoran espacios, guiones y puntos. Validaciones: `name` 2–80 caracteres; `phone` 7–15 dígitos y único;

        `nequi_number` exactamente 10 dígitos; `document_id` 5–15 dígitos.

        '
      properties:
        name:
          type: string
        phone:
          type: string
        nequi_number:
          type: string
        document_id:
          type: string
    User:
