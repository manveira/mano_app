# docker-compose.prod.yml — Producción en Azure VM
# Las imágenes vienen de GitHub Container Registry (GHCR)
# Los secretos vienen del archivo .env en el servidor
# IMAGE_TAG: el workflow de despliegue fija el SHA del commit (versión inmutable y con reversión); sin él usa :latest.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mano}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mano-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - mano-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    image: ghcr.io/${GITHUB_OWNER}/mano-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ":8080"
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mano}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      MOCK_MODE: "false"
      SEED_DEMO_DATA: "false"          # nunca crear cuentas de demostración (password123) en producción
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}    # primer administrador (solo si aún no existe ninguno)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}  # mínimo 12 caracteres; quitar del .env tras el primer arranque
      APP_BASE_URL: ${APP_BASE_URL}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET}
      WOMPI_RECONCILE: ${WOMPI_RECONCILE:-true}   # revisa pagos pendientes contra Wompi cada 2 min
      PLATFORM_COMMISSION_RATE: "0.04"
      AUTO_CONFIRM_HOURS: "24"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FROM_EMAIL: ${FROM_EMAIL}
    networks:
      - mano-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/${GITHUB_OWNER}/mano-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    networks:
      - mano-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mano-network

volumes:
  postgres-data:

networks:
  mano-network:
    driver: bridge
