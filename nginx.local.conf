# nginx.local.conf — Proxy del entorno LOCAL (docker-compose.local.yml).
# Replica la topología ACTUAL (mismo origen): "/" -> web, "/api/" -> backend.
# Es temporal: en F2/F3 el web pasa a llamar al API Gateway (api.mano.local) y este proxy desaparece.
server {
  listen 80;
  server_name _;
  client_max_body_size 10M;

  location /api/ {
    proxy_pass http://core:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
